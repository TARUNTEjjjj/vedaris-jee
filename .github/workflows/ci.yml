name: Verify Vedaris
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vedaris-static
          path: dist/
          retention-days: 7
